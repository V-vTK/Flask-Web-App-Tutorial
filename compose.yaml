services:
  web:
    build: .
    environment:
      PORT: "5001"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
    ports:
      - "${HOST_PORT:-5001}:5001"
    volumes:
      - app-data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5001/login', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
